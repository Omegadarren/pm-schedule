<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project On Hold</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      padding: 56px 48px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 90%;
    }
    .icon { font-size: 56px; margin-bottom: 24px; }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.01em;
      margin-bottom: 14px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏸</div>
    <h1>This project has been put on hold.</h1>
    <p>We'll be back soon. Thank you for your patience.</p>
  </div>
</body>
</html>
